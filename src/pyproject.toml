[project]
name = "cgl-dbx-flood-pipeline"
version = "0.0.2+charm.poc"
description = "Cooperators CHARM flood scoring pipeline (upstream code) + CHARM PoC reconstructions (see PATCHES.md)."
requires-python = ">=3.11"
# Runtime deps are provided by the job environment; upstream internal coop-dbx-* packages are not imported by this code.
dependencies = []

[project.scripts]
cgl-dbx-flood-pipeline = "cgl_dbx_flood_pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cgl_dbx_flood_pipeline"]
